<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 2 - Arrastrar y Soltar</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="modulo2.html">&larr; Volver</a>
    <h1>Arrastrar y Soltar</h1>
  </div>

  <div class="leccion">
    <div class="juego-card juego-arrastre juego-card--solo">
      <p>Hacé clic y mantené apretado sobre el archivo, arrastralo hasta la carpeta, y soltalo ahi.</p>
      <p class="contador-clic" id="contador-arrastre">0 / 8</p>

      <div class="area area--arrastre" id="area-arrastre">
        <div class="zona-destino" id="zona-destino">
          <span class="icono">&#x1F4C1;</span>
          Soltar aqui
        </div>
        <button type="button" class="archivo-arrastrable" id="archivo-arrastrable">&#x1F4C4;</button>
      </div>

      <p class="mensaje-exito" id="mensaje-arrastre" hidden>&#x2705; &iexcl;Completado! Arrastraste los 8 archivos.</p>
      <button type="button" class="btn-reintentar" id="reiniciar-arrastre">Jugar de nuevo</button>
    </div>
  </div>

  <script>
    const TOTAL_ARRASTRES = 8;

    const area = document.getElementById("area-arrastre");
    const zona = document.getElementById("zona-destino");
    const archivo = document.getElementById("archivo-arrastrable");
    const mensajeEl = document.getElementById("mensaje-arrastre");
    const contadorEl = document.getElementById("contador-arrastre");

    let completados = 0;
    let arrastrando = false;
    let offsetX = 0;
    let offsetY = 0;

    function actualizarContador() {
      contadorEl.textContent = completados + " / " + TOTAL_ARRASTRES;
    }

    function posicionInicial() {
      archivo.style.left = "40px";
      archivo.style.top = (area.clientHeight / 2 - 40) + "px";
    }

    archivo.addEventListener("mousedown", (evento) => {
      arrastrando = true;
      const rect = archivo.getBoundingClientRect();
      offsetX = evento.clientX - rect.left;
      offsetY = evento.clientY - rect.top;
    });

    document.addEventListener("mousemove", (evento) => {
      if (!arrastrando) return;
      const areaRect = area.getBoundingClientRect();
      const x = evento.clientX - areaRect.left - offsetX;
      const y = evento.clientY - areaRect.top - offsetY;
      archivo.style.left = x + "px";
      archivo.style.top = y + "px";

      const archivoRect = archivo.getBoundingClientRect();
      const zonaRect = zona.getBoundingClientRect();
      const cx = archivoRect.left + archivoRect.width / 2;
      const cy = archivoRect.top + archivoRect.height / 2;
      const dentro = cx >= zonaRect.left && cx <= zonaRect.right && cy >= zonaRect.top && cy <= zonaRect.bottom;
      zona.classList.toggle("zona-destino--activa", dentro);
    });

    document.addEventListener("mouseup", () => {
      if (!arrastrando) return;
      arrastrando = false;

      const archivoRect = archivo.getBoundingClientRect();
      const zonaRect = zona.getBoundingClientRect();
      const cx = archivoRect.left + archivoRect.width / 2;
      const cy = archivoRect.top + archivoRect.height / 2;
      const dentro = cx >= zonaRect.left && cx <= zonaRect.right && cy >= zonaRect.top && cy <= zonaRect.bottom;
      zona.classList.remove("zona-destino--activa");

      if (dentro) {
        completados++;
        actualizarContador();
        if (completados >= TOTAL_ARRASTRES) {
          mensajeEl.hidden = false;
          archivo.hidden = true;
          return;
        }
      }
      posicionInicial();
    });

    document.getElementById("reiniciar-arrastre").addEventListener("click", () => {
      completados = 0;
      actualizarContador();
      mensajeEl.hidden = true;
      archivo.hidden = false;
      posicionInicial();
    });

    actualizarContador();
    posicionInicial();
  </script>
</body>
</html>
