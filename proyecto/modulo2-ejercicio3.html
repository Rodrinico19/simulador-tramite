<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 3 - Clic Derecho</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="modulo2.html">&larr; Volver</a>
    <h1>Clic Derecho</h1>
  </div>

  <div class="leccion">
    <div class="juego-card juego-clic juego-card--solo">
      <p>Hacele clic con el boton derecho del mouse a la carpeta y elegí cualquier opcion del menu que aparece.</p>
      <p class="contador-clic" id="contador-derecho">0 / 10</p>
      <div class="area" id="area-derecho">
        <button type="button" class="carpeta" id="carpeta-derecho">&#x1F4C1;</button>
        <div class="menu-contextual" id="menu-contextual" hidden>
          <button type="button">Abrir</button>
          <button type="button">Copiar</button>
          <button type="button">Eliminar</button>
        </div>
      </div>
      <p class="mensaje-exito" id="mensaje-derecho" hidden>&#x2705; &iexcl;Completado! Hiciste clic derecho 10 veces.</p>
      <button type="button" class="btn-reintentar" id="reiniciar-derecho">Jugar de nuevo</button>
    </div>
  </div>

  <script>
    const TOTAL_DERECHO = 10;

    const areaDerecho = document.getElementById("area-derecho");
    const carpetaDerecho = document.getElementById("carpeta-derecho");
    const menu = document.getElementById("menu-contextual");
    const mensajeDerecho = document.getElementById("mensaje-derecho");
    const contadorDerecho = document.getElementById("contador-derecho");

    let clicsDerechos = 0;

    function actualizarContadorDerecho() {
      contadorDerecho.textContent = clicsDerechos + " / " + TOTAL_DERECHO;
    }

    function moverCarpetaDerecho() {
      const maxX = Math.max(areaDerecho.clientWidth - 120, 0);
      const maxY = Math.max(areaDerecho.clientHeight - 120, 0);
      carpetaDerecho.style.left = Math.random() * maxX + "px";
      carpetaDerecho.style.top = Math.random() * maxY + "px";
      carpetaDerecho.hidden = false;
    }

    function ocultarMenu() {
      menu.hidden = true;
    }

    areaDerecho.addEventListener("contextmenu", (evento) => {
      evento.preventDefault();
    });

    carpetaDerecho.addEventListener("contextmenu", (evento) => {
      evento.preventDefault();
      const areaRect = areaDerecho.getBoundingClientRect();
      menu.style.left = (evento.clientX - areaRect.left) + "px";
      menu.style.top = (evento.clientY - areaRect.top) + "px";
      menu.hidden = false;
    });

    menu.querySelectorAll("button").forEach((opcion) => {
      opcion.addEventListener("click", () => {
        ocultarMenu();
        clicsDerechos++;
        actualizarContadorDerecho();
        if (clicsDerechos >= TOTAL_DERECHO) {
          mensajeDerecho.hidden = false;
          carpetaDerecho.hidden = true;
        } else {
          moverCarpetaDerecho();
        }
      });
    });

    document.addEventListener("click", (evento) => {
      if (!menu.hidden && evento.target.closest("#menu-contextual") === null) {
        ocultarMenu();
      }
    });

    document.getElementById("reiniciar-derecho").addEventListener("click", () => {
      clicsDerechos = 0;
      actualizarContadorDerecho();
      mensajeDerecho.hidden = true;
      ocultarMenu();
      moverCarpetaDerecho();
    });

    actualizarContadorDerecho();
    moverCarpetaDerecho();
  </script>
</body>
</html>
