<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 4 - Practicar el Pulso</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="modulo1.html">&larr; Volver</a>
    <h1>Practicar el Pulso</h1>
  </div>

  <div class="leccion">
    <div class="juego-card juego-pulso juego-card--solo">
      <p>Mové el mouse de "Salida" hasta "Meta" sin que el cuadrado se salga del rectángulo. Hay que completar 10 pasadas.</p>

      <div class="vidas" id="vidas-pulso">
        <span class="corazon">&#x2764;&#xFE0F;</span>
        <span class="corazon">&#x2764;&#xFE0F;</span>
        <span class="corazon">&#x2764;&#xFE0F;</span>
      </div>
      <p class="contador-clic" id="contador-pulso">Pasada 0 / 10</p>

      <div class="pulso-zona" id="pulso-zona">
        <div class="pulso-pista" id="pulso-pista">
          <span class="pulso-etiqueta pulso-etiqueta--salida">Salida</span>
          <span class="pulso-etiqueta pulso-etiqueta--meta">Meta</span>
        </div>
        <div class="pulso-cuadrado" id="pulso-cuadrado" hidden></div>
      </div>

      <p class="mensaje-exito" id="mensaje-pulso" hidden>&#x2705; &iexcl;Completado! Hiciste las 10 pasadas.</p>
      <p class="mensaje-perdiste" id="mensaje-perdiste" hidden>&#x1F494; &iexcl;Te quedaste sin vidas!<br>Empezar de Nuevo</p>
      <button type="button" class="btn-reintentar" id="reiniciar-pulso">Reiniciar</button>
    </div>
  </div>

  <script>
    const TOTAL_PASADAS = 10;
    const VIDAS_INICIALES = 3;
    const ANCHO_ZONA = 90;

    const zona = document.getElementById("pulso-zona");
    const pista = document.getElementById("pulso-pista");
    const cuadrado = document.getElementById("pulso-cuadrado");
    const corazones = document.querySelectorAll("#vidas-pulso .corazon");
    const contadorEl = document.getElementById("contador-pulso");
    const mensajeEl = document.getElementById("mensaje-pulso");
    const mensajePerdisteEl = document.getElementById("mensaje-perdiste");
    const botonReiniciar = document.getElementById("reiniciar-pulso");

    let vidas = VIDAS_INICIALES;
    let pasadas = 0;
    let enCamino = false;
    let terminado = false;

    function actualizarContador() {
      contadorEl.textContent = "Pasada " + pasadas + " / " + TOTAL_PASADAS;
    }

    function reiniciarCorazones() {
      corazones.forEach((corazon) => {
        corazon.textContent = "❤️";
        corazon.classList.remove("rota", "perdida");
      });
    }

    function romperCorazon() {
      const restantes = [...corazones].filter((c) => !c.classList.contains("perdida"));
      const corazon = restantes[restantes.length - 1];
      if (!corazon) return;
      corazon.textContent = "\u{1F494}";
      corazon.classList.add("rota");
      setTimeout(() => {
        corazon.classList.add("perdida");
      }, 350);
    }

    function reiniciarTodo() {
      vidas = VIDAS_INICIALES;
      pasadas = 0;
      enCamino = false;
      terminado = false;
      mensajeEl.hidden = true;
      mensajePerdisteEl.hidden = true;
      botonReiniciar.textContent = "Reiniciar";
      reiniciarCorazones();
      actualizarContador();
    }

    function perderVida() {
      vidas--;
      romperCorazon();
      enCamino = false;
      if (vidas <= 0) {
        terminado = true;
        setTimeout(() => {
          mensajePerdisteEl.hidden = false;
          botonReiniciar.textContent = "Empezar de Nuevo";
        }, 400);
      }
    }

    function completarPasada() {
      pasadas++;
      actualizarContador();
      enCamino = false;
      if (pasadas >= TOTAL_PASADAS) {
        terminado = true;
        mensajeEl.hidden = false;
      }
    }

    zona.addEventListener("mousemove", (evento) => {
      if (terminado) return;

      const zonaRect = zona.getBoundingClientRect();
      const pistaRect = pista.getBoundingClientRect();

      const mx = evento.clientX - zonaRect.left;
      const my = evento.clientY - zonaRect.top;

      cuadrado.hidden = false;
      cuadrado.style.left = (mx - cuadrado.offsetWidth / 2) + "px";
      cuadrado.style.top = (my - cuadrado.offsetHeight / 2) + "px";

      const pistaLeft = pistaRect.left - zonaRect.left;
      const pistaRight = pistaRect.right - zonaRect.left;
      const pistaTop = pistaRect.top - zonaRect.top;
      const pistaBottom = pistaRect.bottom - zonaRect.top;

      // El cuadrado siempre tiene que quedar dentro del rectangulo
      // (arriba, abajo, izquierda y derecha). Salirse por cualquier lado
      // cuenta como error.
      const dentroDelRectangulo =
        mx >= pistaLeft && mx <= pistaRight && my >= pistaTop && my <= pistaBottom;
      const enZonaSalida = dentroDelRectangulo && mx <= pistaLeft + ANCHO_ZONA;
      const enZonaMeta = dentroDelRectangulo && mx >= pistaRight - ANCHO_ZONA;

      if (enZonaMeta && enCamino) {
        completarPasada();
      } else if (dentroDelRectangulo) {
        if (enZonaSalida) {
          enCamino = true;
        }
      } else if (enCamino) {
        perderVida();
      }
    });

    document.getElementById("reiniciar-pulso").addEventListener("click", reiniciarTodo);

    actualizarContador();
  </script>
</body>
</html>
