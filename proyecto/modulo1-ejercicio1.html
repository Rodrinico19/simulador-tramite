<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 - Mover la Flechita</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="modulo1.html">&larr; Volver</a>
    <h1>Mover la Flechita</h1>
  </div>

  <div class="leccion">
    <div class="juego-card juego-mover juego-card--solo">
      <p>Pasa el mouse por encima de los 8 iconos, sin hacer clic.</p>
      <div class="iconos" id="iconos-mover">
        <span class="icono">&#x1F4C1;</span>
        <span class="icono">&#x1F5BC;&#xFE0F;</span>
        <span class="icono">&#x1F3B5;</span>
        <span class="icono">&#x1F4C4;</span>
        <span class="icono">&#x1F5D1;&#xFE0F;</span>
        <span class="icono">&#x1F4F7;</span>
        <span class="icono">&#x1F3AC;</span>
        <span class="icono">&#x1F4DA;</span>
      </div>
      <p class="mensaje-exito" id="mensaje-mover" hidden>&#x2705; &iexcl;Completado! Pasaste por los 8 iconos.</p>
      <button type="button" class="btn-reintentar" id="reiniciar-mover">Reiniciar</button>
    </div>
  </div>

  <script>
    const iconosMover = document.querySelectorAll("#iconos-mover .icono");
    const mensajeMover = document.getElementById("mensaje-mover");

    function reiniciarJuegoMover() {
      mensajeMover.hidden = true;
      iconosMover.forEach((icono) => icono.classList.remove("marcado"));
    }

    iconosMover.forEach((icono) => {
      icono.addEventListener("mouseenter", () => {
        icono.classList.add("marcado");
        const todosMarcados = [...iconosMover].every((i) => i.classList.contains("marcado"));
        if (todosMarcados) {
          mensajeMover.hidden = false;
        }
      });
    });

    document.getElementById("reiniciar-mover").addEventListener("click", reiniciarJuegoMover);
  </script>
</body>
</html>
