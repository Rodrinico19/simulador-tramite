<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5 - Hacer Puntos Rojos</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="modulo1.html">&larr; Volver</a>
    <h1>Hacer Puntos Rojos</h1>
  </div>

  <div class="leccion">
    <div class="juego-card juego-puntos juego-card--solo">
      <p>Hacé clic con el boton izquierdo del mouse en cualquier parte de la hoja para dejar un punto rojo.</p>
      <p class="contador-clic" id="contador-puntos">0 / 20</p>

      <div class="hoja" id="hoja-puntos">
        <div class="sello-cursor" id="sello-cursor" hidden>
          <div class="sello-cursor__cuerpo"></div>
          <div class="sello-cursor__base"></div>
        </div>
      </div>

      <p class="mensaje-exito" id="mensaje-puntos" hidden>&#x2705; &iexcl;Completado! Hiciste los 20 puntos.</p>
      <button type="button" class="btn-reintentar" id="reiniciar-puntos">Borrar y Reiniciar</button>
    </div>
  </div>

  <script>
    const TOTAL_PUNTOS = 20;

    const hoja = document.getElementById("hoja-puntos");
    const sello = document.getElementById("sello-cursor");
    const contadorEl = document.getElementById("contador-puntos");
    const mensajeEl = document.getElementById("mensaje-puntos");

    let puntos = 0;

    function actualizarContador() {
      contadorEl.textContent = puntos + " / " + TOTAL_PUNTOS;
    }

    hoja.addEventListener("mousemove", (evento) => {
      const hojaRect = hoja.getBoundingClientRect();
      const x = evento.clientX - hojaRect.left;
      const y = evento.clientY - hojaRect.top;

      sello.hidden = false;
      sello.style.left = x + "px";
      sello.style.top = y + "px";
    });

    hoja.addEventListener("mouseleave", () => {
      sello.hidden = true;
    });

    hoja.addEventListener("click", (evento) => {
      sello.classList.add("sello-cursor--presionado");
      setTimeout(() => sello.classList.remove("sello-cursor--presionado"), 150);

      if (puntos >= TOTAL_PUNTOS) return;

      const hojaRect = hoja.getBoundingClientRect();
      const x = evento.clientX - hojaRect.left;
      const y = evento.clientY - hojaRect.top;

      const punto = document.createElement("div");
      punto.className = "punto-rojo";
      punto.style.left = x + "px";
      punto.style.top = y + "px";
      hoja.appendChild(punto);

      puntos++;
      actualizarContador();

      if (puntos >= TOTAL_PUNTOS) {
        mensajeEl.hidden = false;
      }
    });

    document.getElementById("reiniciar-puntos").addEventListener("click", () => {
      hoja.querySelectorAll(".punto-rojo").forEach((punto) => punto.remove());
      puntos = 0;
      actualizarContador();
      mensajeEl.hidden = true;
    });

    actualizarContador();
  </script>
</body>
</html>
