<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 1 - Doble Clic</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="modulo2.html">&larr; Volver</a>
    <h1>Doble Clic</h1>
  </div>

  <div class="leccion">
    <div class="juego-card juego-clic juego-card--solo">
      <p>Hacele doble clic a la carpeta para abrirla. Cada vez que la abrís, aparece otra en otro lugar.</p>
      <p class="contador-clic" id="contador-doble">0 / 10</p>
      <div class="area" id="area-doble">
        <button type="button" class="carpeta" id="carpeta-doble">&#x1F4C1;</button>
      </div>
      <p class="mensaje-exito" id="mensaje-doble" hidden>&#x2705; &iexcl;Completado! Abriste las 10 carpetas.</p>
      <button type="button" class="btn-reintentar" id="reiniciar-doble">Jugar de nuevo</button>
    </div>
  </div>

  <script>
    const TOTAL_DOBLE = 10;

    const areaDoble = document.getElementById("area-doble");
    const carpetaDoble = document.getElementById("carpeta-doble");
    const mensajeDoble = document.getElementById("mensaje-doble");
    const contadorDoble = document.getElementById("contador-doble");

    let doblesRealizados = 0;

    function actualizarContadorDoble() {
      contadorDoble.textContent = doblesRealizados + " / " + TOTAL_DOBLE;
    }

    function moverCarpetaDoble() {
      const maxX = Math.max(areaDoble.clientWidth - 120, 0);
      const maxY = Math.max(areaDoble.clientHeight - 120, 0);
      carpetaDoble.style.left = Math.random() * maxX + "px";
      carpetaDoble.style.top = Math.random() * maxY + "px";
      carpetaDoble.hidden = false;
    }

    carpetaDoble.addEventListener("dblclick", () => {
      carpetaDoble.textContent = "\u{1F4C2}";
      carpetaDoble.classList.add("carpeta--abierta");

      doblesRealizados++;
      actualizarContadorDoble();

      setTimeout(() => {
        carpetaDoble.classList.remove("carpeta--abierta");
        carpetaDoble.textContent = "\u{1F4C1}";
        if (doblesRealizados >= TOTAL_DOBLE) {
          mensajeDoble.hidden = false;
          carpetaDoble.hidden = true;
        } else {
          moverCarpetaDoble();
        }
      }, 450);
    });

    document.getElementById("reiniciar-doble").addEventListener("click", () => {
      doblesRealizados = 0;
      actualizarContadorDoble();
      mensajeDoble.hidden = true;
      carpetaDoble.classList.remove("carpeta--abierta");
      carpetaDoble.textContent = "\u{1F4C1}";
      moverCarpetaDoble();
    });

    actualizarContadorDoble();
    moverCarpetaDoble();
  </script>
</body>
</html>
