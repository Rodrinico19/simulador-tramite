<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modulo 2 - Mouse Medio</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="header-pagina">
    <a class="volver" href="curso1.html">&larr; Volver</a>
    <h1>Modulo 2 - Mouse Medio</h1>
  </div>

  <div class="leccion">
    <div class="carrusel">
      <img class="carrusel__img" id="carrusel-img" src="assets/clase2/slide1.png" alt="Diapositiva 1 de 12">

      <div class="carrusel__controles">
        <button type="button" id="carrusel-prev">&larr; Anterior</button>
        <span class="carrusel__contador" id="carrusel-contador">1 / 12</span>
        <button type="button" id="carrusel-next">Siguiente &rarr;</button>
      </div>
    </div>

    <a class="btn-descarga" href="assets/descargas/clase2.pdf" download>Descargar PDF de la clase</a>
  </div>

  <script>
    const slides = [
      "assets/clase2/slide1.png",
      "assets/clase2/slide2.png",
      "assets/clase2/slide3.png",
      "assets/clase2/slide4.png",
      "assets/clase2/slide5.png",
      "assets/clase2/slide6.png",
      "assets/clase2/slide7.png",
      "assets/clase2/slide8.png",
      "assets/clase2/slide9.png",
      "assets/clase2/slide10.png",
      "assets/clase2/slide11.png",
      "assets/clase2/slide12.png"
    ];

    let indiceActual = 0;

    const imgEl = document.getElementById("carrusel-img");
    const contadorEl = document.getElementById("carrusel-contador");

    function mostrarSlide(indice) {
      indiceActual = indice;
      imgEl.src = slides[indiceActual];
      imgEl.alt = "Diapositiva " + (indiceActual + 1) + " de " + slides.length;
      contadorEl.textContent = (indiceActual + 1) + " / " + slides.length;
    }

    document.getElementById("carrusel-prev").addEventListener("click", () => {
      mostrarSlide((indiceActual - 1 + slides.length) % slides.length);
    });

    document.getElementById("carrusel-next").addEventListener("click", () => {
      mostrarSlide((indiceActual + 1) % slides.length);
    });
  </script>
</body>
</html>
